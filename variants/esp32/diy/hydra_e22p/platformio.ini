; HydraE22P - Meshtastic DIY v1 hardware with some specific changes
[env:hydraE22P]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P
custom_meshtastic_tags = DIY

extends = esp32_base
board = esp32doit-devkit-v1
board_check = true
# Opcja 1 (2026-11-06): OnDemand i BroadcastAssist włączone także na HM5, jak w hydraE22P_psram (OnDemand wymaga BroadcastAssist przy linkowaniu).
build_src_filter =
  ${esp32_base.build_src_filter}
# Framework 3.3.12, jak w hydraE22P_psram (develop oczekuje NetworkClientSecure)
platform_packages =
  platformio/tool-mklittlefs@1.203.210628
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
build_flags =
  ${esp32_base.build_flags}
  ; no DIY_V1 define: HW_VENDOR falls through to PRIVATE_HW (255) in src/platform/esp32/architecture.h
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D MAX_NUM_NODES=80 ; hydra: smaller NodeDB for RAM headroom (no PSRAM); full DB drops stale/farthest nodes first
  -D USE_EBYTE_E22P ; Ebyte E22P-868M30S and E22P-915M30S: pin 14 is power/high, not RXEN. Do not use with standard E22 or E22P-433M30S (wrong RF path / damage risk).
  -D HYDRA_WIFI_TX_POWER_QDBM=8 ; hydra: minimalna moc Wi-Fi (8 = 2 dBm), test stabilności zasilania HM5
  ;-DBOARD_HAS_PSRAM ; If a Wrover or Wroom module with a soldered PSRAM chip is used, the ESP32 will support up to 4 MB of memory.
  ;-D MAX_NUM_NODES=150 ; Tested a PSRAM equipped node with allocated space for 10000 (!) entries in the node database for several weeks without any problems.

; Hydra z modułem WROVER/WROOM z PSRAM (następne płytki). Osobny env, żeby nie zmieniać firmware na obecnych Hydrach bez PSRAM.
; PSRAM zwiększa zużycie IRAM0 (flagi cache-fix), na bazie 2.7 grozi to błędem "IRAM0 segment data does not fit" (issue #11336).
[env:hydraE22P_psram]
extends = esp32_base
# fw+: esp32dev has no PSRAM flag, so the SDK build disabled SPIRAM (spiram=none) and the board reported Total PSRAM 0.
# freenove_esp32_wrover carries -DBOARD_HAS_PSRAM in its extra_flags; esp32_pre.py then enables quad SPIRAM (2026-11-06).
board = freenove_esp32_wrover
board_check = true
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P_PSRAM
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P PSRAM
custom_meshtastic_tags = DIY
# Opcja 1 (2026-11-04): OnDemand i BroadcastAssist włączone z buildu, dokańczanie elementów FW+ w develop (wcześniej opcja 2 z 2026-11-02).
build_src_filter =
  ${esp32_base.build_src_filter}
build_flags =
  ${esp32_base.build_flags}
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D USE_EBYTE_E22P
  -D MAX_NUM_NODES=1000
  -D MESHTASTIC_BOOT_CACHE_BUDGET=50000 ; hydra: PSRAM variant only; 1000-node PacketHistory (40 KB) + caches = 48020 B
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -mfix-esp32-psram-cache-strategy=memw
# Pin framework 3.3.12: develop config expects NetworkClientSecure (present in 3.3.12, not in the classic 2.0.17 package)
platform_packages =
  platformio/tool-mklittlefs@1.203.210628
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
; Test 2026-11-03: ten sam env na platformie/frameworku z v27 (IDF 4.4, espressif32@6.13.0), żeby sprawdzić czy Wi-Fi AUTH_EXPIRE wynika z IDF 5 w pioarduino.
[env:hydraE22P_idf4]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = HYDRAE22P
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = HydraE22P IDF4
custom_meshtastic_tags = DIY

extends = esp32_base
platform = platformio/espressif32@6.13.0
board = esp32doit-devkit-v1
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D EBYTE_E22
  -I variants/esp32/diy/hydra_e22p
  -ULED_BUILTIN
  -D MAX_NUM_NODES=80
  -D USE_EBYTE_E22P
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1 ; hydra test IDF4.4: NimBLE 2.x API z IDF5 nie kompiluje się na 1.x; BT do osobnego portu
build_src_filter =
  ${esp32_base.build_src_filter} -<modules/OnDemandModule.cpp> -<modules/BroadcastAssistModule.cpp> -<platform/extra_variants/>
